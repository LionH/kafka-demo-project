apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
spec:
  replicas: {{ .Values.consumer.replicaCount }}
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
        - name: consumer
          image: {{ .Values.consumer.image }}
          imagePullPolicy: Never
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.consumer.env.KAFKA_BOOTSTRAP_SERVERS }}
            - name: KAFKA_TOPIC
              value: {{ .Values.consumer.env.KAFKA_TOPIC }}
            - name: KAFKA_GROUP_ID
              value: {{ .Values.consumer.env.KAFKA_GROUP_ID }}
